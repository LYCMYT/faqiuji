<!doctype html><html lang="zh"><meta charset="utf-8"><title>PRT-0603 上层留球夹</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1200px;margin:32px auto;color:#233f4d;background:#f5f8fa}h1{color:#146e73}.grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}img{max-width:100%}.orth{display:flex}.orth img{width:49%}h3{margin-bottom:0}p{margin-top:3px}small{color:#8d5a15}</style><a href="../../../viewer/">← 返回三维查看器</a><h1>PRT-0603 · 上层留球夹</h1><small>概念工程版 / 型号与配合未冻结 / 非加工图</small><div class="grid"><div><img src="../PRT-0603_iso.png"><div class="orth"><img src="../PRT-0603_front.png"><img src="../PRT-0603_side.png"></div><img width="220" src="../PRT-0603_location.png"></div><div><h3>几何包络</h3><p>18.0 × 116.0 × 12.0 mm（含所示实例）</p><h3>功能</h3><p>在释放最下面一只球时 保留上方球堆。</p><h3>连接 / 基准</h3><p>与 0604 协同；由 0605 执行器驱动，安装在 H+280 以上试验区。</p><h3>材料 / 工艺</h3><p>低速尼龙/POM夹体与软接触垫</p><h3>拆装</h3><p>打开分球盒侧盖，向两侧取出。</p><h3>待验证</h3><p>先测试新旧羽球的分离、夹持力和卡球；零件形状随试验修正。 关联：U03</p><h3>实例</h3><p>PRT-0603__L, PRT-0603__R</p></div></div></html>
