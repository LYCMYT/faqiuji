<!doctype html><html lang="zh"><meta charset="utf-8"><title>PRT-0101-D 配重承托梁</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1200px;margin:32px auto;color:#233f4d;background:#f5f8fa}h1{color:#146e73}.grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}img{max-width:100%}.orth{display:flex}.orth img{width:49%}h3{margin-bottom:0}p{margin-top:3px}small{color:#8d5a15}</style><a href="../../../viewer/">← 返回三维查看器</a><h1>PRT-0101-D · 配重承托梁</h1><small>概念工程版 / 型号与配合未冻结 / 非加工图</small><div class="grid"><div><img src="../PRT-0101-D_iso.png"><div class="orth"><img src="../PRT-0101-D_front.png"><img src="../PRT-0101-D_side.png"></div><img width="220" src="../PRT-0101-D_location.png"></div><div><h3>几何包络</h3><p>420.0 × 40.0 × 8.0 mm（含所示实例）</p><h3>功能</h3><p>把立柱、配重、电气舱和支撑脚的载荷传递到地面。</p><h3>连接 / 基准</h3><p>连接 0201 立柱、0102 配重板、0103 支腿和 0803 电气舱罩；孔位由这些接口共同生成。</p><h3>材料 / 工艺</h3><p>铝型材与连接板，或焊接金属框架</p><h3>拆装</h3><p>从上方拆安装板，保留扳手进入空间。</p><h3>待验证</h3><p>计算最高轴高、偏转头部及满筒时的质心；不能只根据底板宽度判定防倾覆。 关联：U07</p><h3>实例</h3><p>PRT-0101-D</p></div></div></html>
