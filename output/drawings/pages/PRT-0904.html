<!doctype html><html lang="zh"><meta charset="utf-8"><title>PRT-0904 自锁急停按钮</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1200px;margin:32px auto;color:#233f4d;background:#f5f8fa}h1{color:#146e73}.grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}img{max-width:100%}.orth{display:flex}.orth img{width:49%}h3{margin-bottom:0}p{margin-top:3px}small{color:#8d5a15}</style><a href="../../../viewer/">← 返回三维查看器</a><h1>PRT-0904 · 自锁急停按钮</h1><small>概念工程版 / 型号与配合未冻结 / 非加工图</small><div class="grid"><div><img src="../PRT-0904_iso.png"><div class="orth"><img src="../PRT-0904_front.png"><img src="../PRT-0904_side.png"></div><img width="220" src="../PRT-0904_location.png"></div><div><h3>几何包络</h3><p>105.0 × 77.0 × 90.0 mm（含所示实例）</p><h3>功能</h3><p>在机器侧提供可触达的物理停止入口。</p><h3>连接 / 基准</h3><p>安装在固定侧易达面板，接 0903；复位不自动恢复发球。</p><h3>材料 / 工艺</h3><p>合适规格的急停按钮与触点组件</p><h3>拆装</h3><p>从面板后侧拆触点，外侧取下按钮。</p><h3>待验证</h3><p>停止后飞轮可能仍有惯性；不能把按钮复位当成重新开机许可。 关联：U08/U09</p><h3>实例</h3><p>PRT-0904, PRT-0904-A, PRT-0904-B</p></div></div></html>
