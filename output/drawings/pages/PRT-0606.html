<!doctype html><html lang="zh"><meta charset="utf-8"><title>PRT-0606 可升降外导球套</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1200px;margin:32px auto;color:#233f4d;background:#f5f8fa}h1{color:#146e73}.grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}img{max-width:100%}.orth{display:flex}.orth img{width:49%}h3{margin-bottom:0}p{margin-top:3px}small{color:#8d5a15}</style><a href="../../../viewer/">← 返回三维查看器</a><h1>PRT-0606 · 可升降外导球套</h1><small>概念工程版 / 型号与配合未冻结 / 非加工图</small><div class="grid"><div><img src="../PRT-0606_iso.png"><div class="orth"><img src="../PRT-0606_front.png"><img src="../PRT-0606_side.png"></div><img width="220" src="../PRT-0606_location.png"></div><div><h3>几何包络</h3><p>108.0 × 86.0 × 150.0 mm（含所示实例）</p><h3>功能</h3><p>落球时引导球进入托架；转头前收回，让整只球脱离固定结构。</p><h3>连接 / 基准</h3><p>回缩时套在 0601 外径 80 外；直径间隙 2 为示意，另设导轨保证不擦管。</p><h3>材料 / 工艺</h3><p>轻质光滑管及导向滑块</p><h3>拆装</h3><p>取下快拆导轨后向下拆套。</p><h3>待验证</h3><p>自由落球、裙部擦碰、下端与低位夹爪及上下限位都需验证；不是已解决的供球机构。 关联：U04/U06</p><h3>实例</h3><p>PRT-0606, PRT-0606-A</p></div></div></html>
