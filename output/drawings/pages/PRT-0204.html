<!doctype html><html lang="zh"><meta charset="utf-8"><title>PRT-0204 导向夹紧座</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1200px;margin:32px auto;color:#233f4d;background:#f5f8fa}h1{color:#146e73}.grid{display:grid;grid-template-columns:2fr 1fr;gap:25px}img{max-width:100%}.orth{display:flex}.orth img{width:49%}h3{margin-bottom:0}p{margin-top:3px}small{color:#8d5a15}</style><a href="../../../viewer/">← 返回三维查看器</a><h1>PRT-0204 · 导向夹紧座</h1><small>概念工程版 / 型号与配合未冻结 / 非加工图</small><div class="grid"><div><img src="../PRT-0204_iso.png"><div class="orth"><img src="../PRT-0204_front.png"><img src="../PRT-0204_side.png"></div><img width="220" src="../PRT-0204_location.png"></div><div><h3>几何包络</h3><p>130.0 × 130.0 × 197.5 mm（含所示实例）</p><h3>功能</h3><p>限制内柱晃动，辅助锁紧并使升降可控。</p><h3>连接 / 基准</h3><p>固定在外柱，导向块接触内柱；夹紧旋钮朝后。</p><h3>材料 / 工艺</h3><p>铝合金夹座与低摩擦衬块</p><h3>拆装</h3><p>侧向拆开夹座。</p><h3>待验证</h3><p>夹紧不能替代 0203 锁销；实测摩擦、磨损及侧向晃动。 关联：U07/U09</p><h3>实例</h3><p>PRT-0204__860, PRT-0204__1022.5</p></div></div></html>
