<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f4f7f9"/><style>text{font:20px "Microsoft YaHei",sans-serif;fill:#183a4d}.small{font-size:16px}.box{fill:white;stroke:#087b80;stroke-width:2}.wire{fill:none;stroke:#183a4d;stroke-width:3}</style><text x="30" y="45">BM1 R1 / 功能接线与停止关系（概念，非端子接线图）</text><rect class="box" x="40" y="100" width="220" height="100"/><text x="60" y="140">隔离与保护 / 电源</text><text class="small" x="60" y="175">额定值、型号均待确认</text><rect class="box" x="360" y="100" width="240" height="100"/><text x="380" y="140">独立停止链与驱动使能</text><text class="small" x="380" y="175">架构/制动/停转能力待验证</text><rect class="box" x="760" y="100" width="370" height="100"/><text x="780" y="140">轮组驱动、滑台与执行器</text><text class="small" x="780" y="175">任何软件模拟不能代替硬件停止</text><path class="wire" d="M260 150 H360 M600 150 H760"/><rect class="box" x="40" y="300" width="220" height="100"/><text x="60" y="340">急停、罩门、锁销确认</text><text class="small" x="60" y="375">信号实现与诊断待选型</text><path class="wire" d="M260 350 H320 V180 H360"/><rect class="box" x="360" y="300" width="240" height="100"/><text x="380" y="340">顺序控制与故障锁定</text><text class="small" x="380" y="375">真实超时、去抖、看门狗待定</text><path class="wire" d="M600 350 H700 V180 H760"/><rect class="box" x="760" y="300" width="370" height="100"/><text x="780" y="340">导套 / 滑台 / 夹开 / 出球反馈</text><text class="small" x="780" y="375">出球必须是捕获后的新高→低脉冲</text><path class="wire" d="M760 350 H600"/><text x="40" y="485">互锁顺序：导套上位 → 前移脱筒 → 转头 → 夹开 → 捕获边界停推 → 出球确认 → 撤回</text><text x="40" y="535">禁止：以固定延时替代反馈；出球传感器常高仍继续；故障解除后自动重启。</text><text class="small" x="40" y="595">本图不规定供电电压、引脚、线径、熔断器、制动参数或安全等级。采购与实机验证后另出冻结电气图。</text></svg>