name: R4 lightweight contracts (CAD and render excluded)
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Strict controls, evidence, provenance and gate regressions
        shell: bash
        run: |
          set -e
          for pattern in 'test_control*.py' 'test_command_lifecycle.py' 'test_evidence_inputs.py' 'test_support_solver.py' 'test_build_provenance.py' 'test_release_gates.py' 'test_input_immutability.py' 'test_part_role_contract.py'; do
            python -m unittest discover -s tests -p "$pattern" -v
          done
      - name: Scope statement
        run: echo 'CAD, Blender, PDF visual review, browser and hardware acceptance NOT_RUN in this job.'
