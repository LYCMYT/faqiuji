<!doctype html><html lang="zh"><meta charset="utf-8"><title>BM1 R3 连接结构</title>
<style>body{margin:0;font:14px system-ui;color:#183a4d;background:#eef2f5}header{padding:14px 22px;background:#183a4d;color:white}main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 58px)}aside{padding:20px;background:white;overflow:auto}select{width:100%;padding:8px}button{margin:8px 4px;padding:8px}a{color:#087b80}#stage{min-width:0;position:relative}#status{position:absolute;bottom:15px;left:18px}canvas{display:block}.note{padding:12px;background:#fff3db;line-height:1.7}</style>
<header>BM1 R3 / 低速台架与夹块连接结构</header><main><aside><p><a href="index.html">图集、STEP与加工资料</a></p><p><a href="../../viewer/">R1整机查看器</a></p><label>实例</label><select id="part"><option value="">全部155件</option></select><button id="isolate">单独查看</button><button id="all">恢复全部</button><p id="info">拖动旋转、滚轮缩放、点击零件查看编号。</p><div class="note">几何与工具通道已检查。实际执行器适配、上夹导向、紧固载荷和台面锚固仍待确认。</div></aside><div id="stage"><span id="status">加载本地GLB…</span></div></main>
<script type="importmap">{"imports":{"three":"../../viewer/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from '../../viewer/OrbitControls.js';import {GLTFLoader} from '../../viewer/GLTFLoader.js';
const host=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#eef2f5');const camera=new THREE.PerspectiveCamera(42,1,.001,30);camera.position.set(1.4,1,2.1);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.16,.13,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x73818c,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);const meshes=[];const select=document.querySelector('#part');
new GLTFLoader().load('BM1_R3_fixture.glb',g=>{scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){meshes.push(o);const a=document.createElement('option');a.value=o.name;a.textContent=o.userData.instance_id||o.name;select.appendChild(a)}});document.querySelector('#status').textContent=meshes.length+' 个原生CAD派生网格 · mm转m · GLB Y-up';window.BM1_R3={meshes,scene};},undefined,e=>document.querySelector('#status').textContent='加载失败：'+e.message);
function info(o){if(!o)return;select.value=o.name;document.querySelector('#info').textContent=[o.userData.instance_id,o.userData.part_id,o.userData.assembly_id,o.userData.family].filter(Boolean).join(' / ')}
select.onchange=()=>info(meshes.find(o=>o.name===select.value));document.querySelector('#isolate').onclick=()=>{if(select.value)meshes.forEach(o=>o.visible=o.name===select.value)};document.querySelector('#all').onclick=()=>meshes.forEach(o=>o.visible=true);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down;renderer.domElement.onpointerdown=e=>down=[e.clientX,e.clientY];renderer.domElement.onpointerup=e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);info(ray.intersectObjects(meshes.filter(o=>o.visible),false)[0]?.object)};
function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></html>
